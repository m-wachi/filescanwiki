version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: tracuser
      POSTGRES_PASSWORD: tracuser
      POSTGRES_DB: trac
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracuser -d trac"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test:

